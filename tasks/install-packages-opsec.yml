---

- name: Update APT package cache
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade APT to the latest packages
  become: true
  ansible.builtin.apt:
    upgrade: safe

- name: 'Install opsec packages'
  become: true
  ansible.builtin.apt:
    name: "{{ item }}"
  loop:

    # expect - automates interactive applications
    # - Used by `321open` to automate `ssh-add` using
    #   passphrases read from Password Store.
    #     https://github.com/DepoXy/321open#👐
    - expect

    # pass - lightweight directory-based password manager
    - pass

    # tomb - crypto undertaker
    # https://dyne.org/software/tomb
    - tomb

    # ufw - program for managing a Netfilter firewall
    - ufw

    # fd - Used by author's `321open` ssh-add wrapper
    # https://github.com/DepoXy/321open#👐
    - fd-find

    # gocryptfs
    # HSTRY/2025-11-11: We used to install from GH release,
    # but nowadays APT has a fairly recent build.
    - gocryptfs

# Author used these tools circa 2019 while developing an encrypted
# thumb drive backup solution, but I haven't used these since then.
- name: 'Install development packages'
  become: true
  ansible.builtin.apt: name={{ item }}
  loop:

    # binwalk - tool library for analyzing binary blobs and executable code
    - binwalk

    # foremost - forensic program to recover lost files
    - foremost

    # pgpdump - PGP packet visualizer
    - pgpdump

  when: zoidy_troglodyte_include_dev_packages

