# CXREF: https://github.com/DepoXy/sh-humble-prompt#🙇
#   ~/.kit/sh/sh-humble-prompt/lib/show-command-name-in-window-title.sh
#   ~/.kit/sh/sh-humble-prompt/lib/set-shell-prompt-and-window-title.sh
# - This setting a tad out of place, or at least the file title of
#   this task suggests we're "hardening" the config, but this doesn't
#   do that. We're just piggy-backing on the one Zoidy Pooh Ansible
#   task that edits sshd_config, so we can help out Homefries.
- name: AcceptEnv ITERM_SESSION_ID so Homefries can number terminal window titles
  become: true
  ansible.builtin.lineinfile:
    dest: /etc/ssh/sshd_config
    # REFER/2025-09-12: Debian 13 adds these 2 lines (not found in Linux Mint):
    #   # Allow client to pass locale and color environment variables
    #   AcceptEnv LANG LC_* COLORTERM NO_COLOR
    # SPIKE/DUNNO: Does config file support more than one ^AcceptEnv line?
    # - HSTRY: Old approach creates second AccepEnv line:
    #     regexp: "^AcceptEnv ITERM_SESSION_ID"
    #     line: "AcceptEnv ITERM_SESSION_ID"
    #   - Nowadays we replace existing AcceptEnv line.
    regexp: "^AcceptEnv "
    line: "AcceptEnv LANG LC_* COLORTERM NO_COLOR ITERM_SESSION_ID"
    state: present
  notify: Restart sshd

# ***
